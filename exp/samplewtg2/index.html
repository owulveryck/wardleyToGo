<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WTG2 Playground</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/monokai.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #1e1e1e; color: #ccc; }
        #toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #2d2d2d; border-bottom: 1px solid #444; flex-shrink: 0; }
        #toolbar h1 { font-size: 14px; color: #e0e0e0; margin-right: auto; }
        #toolbar label { font-size: 13px; cursor: pointer; }
        #toolbar input[type="checkbox"] { margin-right: 4px; }
        #status { font-size: 12px; color: #888; }
        #toolbar .separator { width: 1px; height: 20px; background: #555; }
        #toolbar .slider-group { display: flex; align-items: center; gap: 6px; }
        #toolbar .slider-group input[type="range"] { width: 80px; accent-color: #5e9ed6; }
        #toolbar .slider-group span { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
        #toolbar button { background: #3a3a3a; color: #ccc; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
        #toolbar button:hover { background: #4a4a4a; border-color: #777; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #editor-pane { width: 35%; display: flex; flex-direction: column; border-right: 2px solid #444; }
        #output-pane { flex: 1; overflow: auto; background: #fff; display: flex; align-items: center; justify-content: center; }
        #output-pane svg { max-width: 100%; max-height: 100%; }
        #output-pane .error { color: #e74c3c; font-family: monospace; padding: 20px; background: #fff5f5; width: 100%; }
        .CodeMirror { flex: 1; font-size: 14px; }
    </style>
</head>
<body>
    <div id="toolbar">
        <h1>WTG2 Playground</h1>
        <label><input type="checkbox" id="static"> Static SVG (no JS/CSS)</label>
        <div class="separator"></div>
        <div class="slider-group">
            <label for="resolution">Résolution</label>
            <input type="range" id="resolution" min="1" max="4" step="1" value="2">
            <span id="res-label">2x</span>
        </div>
        <div class="separator"></div>
        <button id="dl-svg" title="Télécharger SVG">⬇ SVG</button>
        <button id="dl-png" title="Télécharger PNG">⬇ PNG</button>
        <span id="status">Loading WASM...</span>
    </div>
    <div id="main">
        <div id="editor-pane">
            <textarea id="source"></textarea>
        </div>
        <div id="output-pane"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/mode/simple.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/monokai.min.js"></script>
    <script src="wasm_exec.js"></script>
    <script>
    // WTG2 syntax mode for CodeMirror
    CodeMirror.defineSimpleMode("wtg2", {
        start: [
            { regex: /\/\/.*/, token: "comment" },
            { regex: /\/\*.*?\*\//, token: "comment" },
            { regex: /^(title|date|author|scope|question|stages)\s*:/, token: "keyword" },
            { regex: /^(anchor|submap|pipeline|group|component)\b/, token: "keyword" },
            { regex: /^(note|warning)\b/, token: "tag" },
            { regex: /^(signal)\s+(accelerating|stagnating|declining)\b/, token: ["tag", "variable-2"] },
            { regex: /->|<->/, token: "operator" },
            { regex: /-\[/, token: "operator", push: "edgeLabel" },
            { regex: />>/, token: "operator" },
            { regex: /!!?/, token: "variable-2" },
            { regex: /\(buy\)|\(outsource\)|\(build\)/, token: "atom" },
            { regex: /\{/, token: "bracket", indent: true },
            { regex: /\}/, token: "bracket", dedent: true },
            { regex: /"[^"]*"/, token: "string" },
            { regex: /\b[IVX]+\.\d+\b/, token: "number" },
            { regex: /#[0-9a-fA-F]{3,8}\b/, token: "number" },
            { regex: /\b(type|color|note)\s*:/, token: "property" },
        ],
        edgeLabel: [
            { regex: /\]->/, token: "operator", pop: true },
            { regex: /./, token: "string" },
        ],
        meta: {
            lineComment: "//",
        }
    });

    const sample = `// Sample Wardley Map
title: Tea Shop

anchor Customer

Cup of Tea : III.5
Tea : II.8
Hot Water : III.7
Cup : IV.5
Water : IV.8
Kettle : III.5 >> IV.2 {
  type: build
  note: "Considering outsourcing"
}
Power : IV.9 (outsource)

Customer -> Cup of Tea -> Tea
Cup of Tea -> Hot Water -> Water
Hot Water -> Kettle -> Power
Cup of Tea -> Cup
`;

    let editor, renderTimer;

    function initEditor() {
        editor = CodeMirror.fromTextArea(document.getElementById("source"), {
            mode: "wtg2",
            theme: "monokai",
            lineNumbers: true,
            tabSize: 2,
            autofocus: true,
        });

        // Load saved content or use sample
        const saved = localStorage.getItem("wtg2-source");
        editor.setValue(saved || sample);

        editor.on("change", () => {
            localStorage.setItem("wtg2-source", editor.getValue());
            scheduleRender();
        });

        document.getElementById("static").addEventListener("change", render);

        const resSlider = document.getElementById("resolution");
        const resLabel = document.getElementById("res-label");
        resSlider.addEventListener("input", () => {
            resLabel.textContent = resSlider.value + "x";
        });

        document.getElementById("dl-svg").addEventListener("click", downloadSVG);
        document.getElementById("dl-png").addEventListener("click", downloadPNG);
    }

    function scheduleRender() {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(render, 500);
    }

    function render() {
        const text = editor.getValue();
        if (!text.trim()) {
            document.getElementById("output-pane").innerHTML = "";
            return;
        }
        if (typeof generateSVG !== "function") {
            document.getElementById("status").textContent = "WASM not loaded yet";
            return;
        }
        const isStatic = document.getElementById("static").checked;
        const result = generateSVG(text, isStatic);
        const output = document.getElementById("output-pane");
        if (result.startsWith("error:")) {
            output.innerHTML = '<div class="error">' + escapeHtml(result) + '</div>';
        } else {
            output.innerHTML = result;
        }
        document.getElementById("status").textContent = "OK";
    }

    function getExportSVG() {
        // Generate a static SVG for export (no interactive JS/CSS)
        const text = editor.getValue();
        if (!text.trim() || typeof generateSVG !== "function") return null;
        const result = generateSVG(text, true);
        if (result.startsWith("error:")) return null;
        return result;
    }

    function getMapTitle() {
        const text = editor.getValue();
        const m = text.match(/^title\s*:\s*(.+)$/m);
        return m ? m[1].trim().replace(/[^a-zA-Z0-9_\-\s]/g, "").replace(/\s+/g, "_") : "wardley-map";
    }

    function downloadSVG() {
        const svgStr = getExportSVG();
        if (!svgStr) return;
        const blob = new Blob([svgStr], { type: "image/svg+xml" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = getMapTitle() + ".svg";
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function downloadPNG() {
        const svgStr = getExportSVG();
        if (!svgStr) return;
        const scale = parseInt(document.getElementById("resolution").value, 10);
        const baseW = 1100, baseH = 900;
        const w = baseW * scale, h = baseH * scale;

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");

        // White background
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);

        const img = new Image();
        const blob = new Blob([svgStr], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);

        img.onload = () => {
            ctx.drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            canvas.toBlob(pngBlob => {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(pngBlob);
                a.download = getMapTitle() + "_" + scale + "x.png";
                a.click();
                URL.revokeObjectURL(a.href);
            }, "image/png");
        };
        img.src = url;
    }

    function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
    }

    // WASM init
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then(result => {
        go.run(result.instance);
        document.getElementById("status").textContent = "Ready";
        initEditor();
        render();
    }).catch(err => {
        document.getElementById("status").textContent = "WASM load failed: " + err;
        initEditor();
    });
    </script>
</body>
</html>
